# Runs on every push and pull request.
#
# No credentials and no dataset needed: the tests build small synthetic arrays,
# and the one test that reads the real fold manifest skips itself when the file
# is absent. That keeps CI to a couple of minutes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # allows running it by hand from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip          # reuse downloaded wheels between runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
                      torch numpy pandas scikit-learn pyyaml tqdm \
                      fastapi "uvicorn[standard]" httpx mlflow \
                      pytest ruff

      - name: Lint
        run: ruff check src/ tests/

      - name: Run tests
        run: python -m pytest tests/ -v

  docker:
    # Only checks that the image still builds. Pushing to a registry happens in
    # build.yml. GitHub runners are x86_64, which is the architecture Azure
    # needs - so this also catches Dockerfile changes that would break there.
    runs-on: ubuntu-latest
    needs: test               # don't bother building if the tests failed

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Create a placeholder checkpoint
        # The real checkpoint lives in DVC, not Git. Pulling it here would
        # need credentials for a step that only validates the Dockerfile, so
        # an empty file stands in: COPY succeeds, and nothing runs the model.
        run: |
          mkdir -p models/lstm
          touch models/lstm/fold0.pt

      - name: Build the serving image
        run: docker build -f Dockerfile.serve -t ev-battery-serve:ci .

      - name: Report image size
        run: docker images ev-battery-serve:ci
